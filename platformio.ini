[platformio]
default_envs = m5stack-cardputer

[env:m5stack-cardputer]
platform = espressif32@6.9.0
board = m5stack-stamps3
framework = arduino

upload_speed = 921600
monitor_speed = 115200

build_flags =
    -DESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=0
    -DCORE_DEBUG_LEVEL=1

build_unflags =
    -DARDUINO_USB_MODE=1

lib_deps =
    https://github.com/m5stack/M5GFX.git#0.2.16
    https://github.com/m5stack/M5Unified.git#0.2.10
    https://github.com/m5stack/M5Cardputer.git#1.1.1
    LibSSH-ESP32
