# CCCP R3C3 direct cloud LLM settings
schema_version=3
provider=pollinations_legacy
model=openai
api_host=text.pollinations.ai
api_path=/
api_key=

# reply-writer personality, independent of pet
character=mama
character_file=

# courier pet
# auto_other | momo | sumiko | incoming | custom basename
pet=auto_other
pet_name=auto

# From display owner name. auto reads selected PPD.
owner_name=auto

# HOME/owner email embedded inside the courier PPD.
# It is not the mail recipient.
pet_home_address=test3@test.test

subject=おへんじ
max_reply_chars=360
